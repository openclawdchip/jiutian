<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>朱雀 iexecute 地图</title>
  <style>
    :root {
      --land: #efe6cf;
      --land2: #e7dcc2;
      --ink: #243033;
      --muted: #69746f;
      --border: #8b907f;
      --water: #b7d8dd;
      --park: #d8e7c6;
      --fast: #f3d69a;
      --entry: #cfe9e1;
      --compare: #eadcc9;
      --shift: #dce6f2;
      --mac: #f5d89b;
      --div: #dce8c8;
      --special: #ddd0f0;
      --merge: #dfe3d2;
      --road-casing: #ffffff;
      --road-local: #d6c19b;
      --road-arterial: #e29a3f;
      --road-highway: #c76f2b;
      --road-feedback: #a98bcf;
      --label-bg: rgba(255, 252, 240, 0.82);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 232, 176, 0.58), transparent 30rem),
        radial-gradient(circle at 84% 18%, rgba(183, 216, 221, 0.65), transparent 28rem),
        linear-gradient(135deg, #f7f0df 0%, #e2d5b8 100%);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    main {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(36, 48, 51, 0.035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(36, 48, 51, 0.035) 1px, transparent 1px),
        rgba(255, 252, 242, 0.5);
      background-size: 48px 48px;
    }

    .viewport.dragging {
      cursor: grabbing;
    }

    .zoom-layer {
      width: 1680px;
      height: 1080px;
      transform-origin: 0 0;
      will-change: transform;
    }

    .semantic {
      transition: opacity 160ms ease;
    }

    .zoom-layer[data-zoom-level="overview"] .module-detail,
    .zoom-layer[data-zoom-level="overview"] .detail-only,
    .zoom-layer[data-zoom-level="overview"] .local-only {
      opacity: 0;
      pointer-events: none;
    }

    .zoom-layer[data-zoom-level="overview"] .zone-label {
      font-size: 24px;
    }

    .zoom-layer[data-zoom-level="module"] .detail-only,
    .zoom-layer[data-zoom-level="module"] .local-only {
      opacity: 0;
      pointer-events: none;
    }

    .zoom-layer[data-zoom-level="detail"] .module-detail,
    .zoom-layer[data-zoom-level="detail"] .detail-only,
    .zoom-layer[data-zoom-level="detail"] .local-only {
      opacity: 1;
      pointer-events: auto;
    }

    svg {
      display: block;
      width: 1680px;
      height: 1080px;
    }

    .map-frame {
      fill: rgba(255, 250, 236, 0.55);
      stroke: rgba(36, 48, 51, 0.22);
      stroke-width: 2.5;
    }

    .water {
      fill: var(--water);
      opacity: 0.82;
      stroke: rgba(66, 126, 139, 0.3);
      stroke-width: 1.8;
    }

    .region {
      stroke: rgba(36, 48, 51, 0.38);
      stroke-width: 2;
      filter: drop-shadow(0 12px 14px rgba(44, 38, 28, 0.12));
    }

    .zone-label {
      fill: var(--ink);
      font-size: 22px;
      font-weight: 1000;
      letter-spacing: -0.035em;
    }

    .zone-sub {
      fill: rgba(36, 48, 51, 0.68);
      font-size: 12px;
      font-weight: 800;
    }

    .landmark {
      fill: rgba(255, 252, 242, 0.72);
      stroke: rgba(36, 48, 51, 0.35);
      stroke-width: 1.4;
    }

    .landmark-text {
      fill: rgba(36, 48, 51, 0.78);
      font-size: 10.5px;
      font-weight: 900;
    }

    .dot {
      fill: #2d4c4d;
      stroke: #fff6df;
      stroke-width: 2;
    }

    .micro-road-casing {
      fill: none;
      stroke: #ffffff;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .micro-road-core {
      fill: none;
      stroke: #b7a989;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .poi-label {
      fill: rgba(36, 48, 51, 0.75);
      paint-order: stroke;
      stroke: rgba(255, 252, 240, 0.88);
      stroke-width: 4;
      stroke-linejoin: round;
      font-size: 10px;
      font-weight: 900;
    }

    .road-casing {
      fill: none;
      stroke: var(--road-casing);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .road-core {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .highway-casing {
      stroke-width: 18;
    }

    .highway-core {
      stroke: var(--road-highway);
      stroke-width: 11;
    }

    .arterial-casing {
      stroke-width: 13;
    }

    .arterial-core {
      stroke: var(--road-arterial);
      stroke-width: 8;
    }

    .local-casing {
      stroke-width: 8;
    }

    .local-core {
      stroke: var(--road-local);
      stroke-width: 4.5;
    }

    .feedback-casing {
      stroke-width: 12;
      opacity: 0.95;
    }

    .feedback-core {
      stroke: var(--road-feedback);
      stroke-width: 6;
      stroke-dasharray: 16 12;
      opacity: 0.82;
    }

    .road-name {
      fill: rgba(36, 48, 51, 0.78);
      paint-order: stroke;
      stroke: rgba(255, 252, 242, 0.9);
      stroke-width: 5;
      stroke-linejoin: round;
      font-size: 12px;
      font-weight: 1000;
    }

    .shield {
      fill: #fff7df;
      stroke: rgba(36, 48, 51, 0.38);
      stroke-width: 1.4;
    }

    .shield-text {
      fill: #8c4f1d;
      font-size: 11px;
      font-weight: 1000;
    }

    .compass text {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .hud {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 3;
      padding: 7px 10px;
      border: 1px solid rgba(36, 48, 51, 0.18);
      border-radius: 999px;
      color: rgba(36, 48, 51, 0.62);
      background: rgba(255, 252, 240, 0.72);
      font-size: 12px;
      font-weight: 900;
      pointer-events: none;
    }
  </style>
</head>

  <script>
    const layer = document.getElementById("zoomLayer");
    const viewport = document.getElementById("viewport");
    const hud = document.getElementById("hud");
    const mapW = 1680;
    const mapH = 1080;
    let zoom = 0.82;
    let panX = 0;
    let panY = 0;
    let dragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragPanX = 0;
    let dragPanY = 0;

    function zoomLevel() {
      return zoom < 0.9 ? "overview" : zoom < 1.35 ? "module" : "detail";
    }

    function applyTransform() {
      const level = zoomLevel();
      layer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      layer.dataset.zoomLevel = level;
      hud.textContent = `${Math.round(zoom * 100)}% · ${level}`;
    }

    function clampPan() {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      const scaledW = mapW * zoom;
      const scaledH = mapH * zoom;
      const minX = Math.min(0, vw - scaledW);
      const minY = Math.min(0, vh - scaledH);
      panX = Math.max(minX - 160, Math.min(160, panX));
      panY = Math.max(minY - 160, Math.min(160, panY));
    }

    function setZoom(next, anchorX = viewport.clientWidth / 2, anchorY = viewport.clientHeight / 2) {
      const prev = zoom;
      zoom = Math.max(0.45, Math.min(1.9, next));
      const mapX = (anchorX - panX) / prev;
      const mapY = (anchorY - panY) / prev;
      panX = anchorX - mapX * zoom;
      panY = anchorY - mapY * zoom;
      clampPan();
      applyTransform();
    }

    function fitMap() {
      const fit = Math.min(viewport.clientWidth / mapW, viewport.clientHeight / mapH) * 0.96;
      zoom = Math.max(0.45, Math.min(1.0, fit));
      panX = (viewport.clientWidth - mapW * zoom) / 2;
      panY = (viewport.clientHeight - mapH * zoom) / 2;
      applyTransform();
    }

    viewport.addEventListener("pointerdown", (event) => {
      dragging = true;
      viewport.classList.add("dragging");
      viewport.setPointerCapture(event.pointerId);
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragPanX = panX;
      dragPanY = panY;
    });

    viewport.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      event.preventDefault();
      panX = dragPanX + event.clientX - dragStartX;
      panY = dragPanY + event.clientY - dragStartY;
      clampPan();
      applyTransform();
    });

    function stopDrag(event) {
      if (!dragging) return;
      dragging = false;
      viewport.classList.remove("dragging");
      if (event.pointerId !== undefined) viewport.releasePointerCapture(event.pointerId);
    }

    viewport.addEventListener("pointerup", stopDrag);
    viewport.addEventListener("pointercancel", stopDrag);
    viewport.addEventListener("pointerleave", stopDrag);

    viewport.addEventListener("wheel", (event) => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.1 : 0.9;
      setZoom(zoom * factor, event.clientX, event.clientY);
    }, { passive: false });

    viewport.addEventListener("dblclick", (event) => {
      setZoom(zoom < 1.35 ? 1.45 : 0.82, event.clientX, event.clientY);
    });

    window.addEventListener("resize", () => {
      clampPan();
      applyTransform();
    });

    fitMap();
  </script>
</body>
</html>
