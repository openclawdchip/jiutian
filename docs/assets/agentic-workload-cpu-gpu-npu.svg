<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">CPU、GPU、NPU 在 Agentic workload 中的协同分工</title>
  <desc id="desc">以灰阶教材框图展示任务流与 CPU、GPU、NPU、共享状态平面的对应关系，以及典型性能瓶颈。</desc>
  <defs>
    <marker id="arrow-hw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow-hw); }
      .rule { fill: none; stroke: #666; stroke-width: 1.4; }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 22px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="780"/>

  <text class="note" x="136" y="86">任务流</text>
  <line class="rule" x1="134" y1="96" x2="284" y2="96"/>

  <g>
    <rect class="shadow" x="134" y="118" width="180" height="64"/>
    <rect class="light" x="128" y="112" width="180" height="64"/>
    <text class="note" x="218" y="151" text-anchor="middle">检索 / 控制</text>

    <rect class="shadow" x="384" y="118" width="180" height="64"/>
    <rect class="light" x="378" y="112" width="180" height="64"/>
    <text class="note" x="468" y="151" text-anchor="middle">大模型推理</text>

    <rect class="shadow" x="634" y="118" width="220" height="64"/>
    <rect class="light" x="628" y="112" width="220" height="64"/>
    <text class="note" x="738" y="151" text-anchor="middle">边缘 / 低功耗推理</text>

    <rect class="shadow" x="924" y="118" width="240" height="64"/>
    <rect class="light" x="918" y="112" width="240" height="64"/>
    <text class="note" x="1038" y="151" text-anchor="middle">验证 / 调度 / 读写</text>
  </g>

  <path class="line" d="M 308 144 L 378 144"/>
  <path class="line" d="M 558 144 L 628 144"/>
  <path class="line" d="M 848 144 L 918 144"/>

  <g>
    <rect class="shadow" x="104" y="292" width="244" height="118"/>
    <rect class="box" x="98" y="286" width="244" height="118"/>
    <text class="title" x="220" y="334" text-anchor="middle">CPU</text>
    <text class="note" x="220" y="366" text-anchor="middle">控制、调度、工具执行</text>
    <text class="note" x="220" y="392" text-anchor="middle">I/O、状态维护、权限检查</text>

    <rect class="shadow" x="394" y="292" width="244" height="118"/>
    <rect class="box" x="388" y="286" width="244" height="118"/>
    <text class="title" x="510" y="334" text-anchor="middle">GPU</text>
    <text class="note" x="510" y="366" text-anchor="middle">大规模模型推理</text>
    <text class="note" x="510" y="392" text-anchor="middle">吞吐、显存、互连约束</text>

    <rect class="shadow" x="684" y="292" width="244" height="118"/>
    <rect class="box" x="678" y="286" width="244" height="118"/>
    <text class="title" x="800" y="334" text-anchor="middle">NPU</text>
    <text class="note" x="800" y="366" text-anchor="middle">低功耗本地推理</text>
    <text class="note" x="800" y="392" text-anchor="middle">边缘设备与小模型</text>

    <rect class="shadow" x="974" y="292" width="286" height="118"/>
    <rect class="box" x="968" y="286" width="286" height="118"/>
    <text class="title" x="1111" y="334" text-anchor="middle">共享状态平面</text>
    <text class="note" x="1111" y="366" text-anchor="middle">上下文、记忆、存储、网络</text>
    <text class="note" x="1111" y="392" text-anchor="middle">结果读写与数据搬运</text>
  </g>

  <path class="line" d="M 218 176 L 218 286"/>
  <path class="line" d="M 468 176 L 510 286"/>
  <path class="line" d="M 738 176 L 800 286"/>
  <path class="line" d="M 1038 176 L 1111 286"/>

  <text class="note" x="700" y="514" text-anchor="middle">典型瓶颈</text>
  <line class="rule" x1="594" y1="524" x2="806" y2="524"/>

  <g>
    <rect class="shadow" x="104" y="556" width="184" height="58"/>
    <rect class="light" x="98" y="550" width="184" height="58"/>
    <text class="note" x="190" y="586" text-anchor="middle">推理计算</text>

    <rect class="shadow" x="344" y="556" width="184" height="58"/>
    <rect class="light" x="338" y="550" width="184" height="58"/>
    <text class="note" x="430" y="586" text-anchor="middle">上下文搬运</text>

    <rect class="shadow" x="584" y="556" width="184" height="58"/>
    <rect class="light" x="578" y="550" width="184" height="58"/>
    <text class="note" x="670" y="586" text-anchor="middle">工具等待</text>

    <rect class="shadow" x="824" y="556" width="184" height="58"/>
    <rect class="light" x="818" y="550" width="184" height="58"/>
    <text class="note" x="910" y="586" text-anchor="middle">存储检索</text>

    <rect class="shadow" x="1064" y="556" width="184" height="58"/>
    <rect class="light" x="1058" y="550" width="184" height="58"/>
    <text class="note" x="1150" y="586" text-anchor="middle">调度排队</text>
  </g>
</svg>
