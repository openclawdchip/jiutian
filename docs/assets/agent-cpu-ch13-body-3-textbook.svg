<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">从 SPEC 到 Agentic Benchmark 的展开路径</title>
  <desc id="desc">从 SPEC 到 Agentic Benchmark 的展开路径</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #666; stroke-width: 1.4; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .rule { fill: none; stroke: #666; stroke-width: 1.4; }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 21px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
      .small { font: 400 16px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="780"/>
  <g>
  <rect class="shadow" x="506" y="52" width="400" height="74"/>
  <rect class="light" x="500" y="46" width="400" height="74"/>
  <text class="label" x="700" y="88" text-anchor="middle">从SPEC到Agentic</text>
  <text class="small" x="700" y="122" text-anchor="middle">Benchmark</text>
</g>
<g>
  <rect class="shadow" x="90" y="254" width="210" height="116"/>
  <rect class="box" x="84" y="248" width="210" height="116"/>
  <text class="title" x="189" y="290" text-anchor="middle">Benchmark是</text>
  <text class="note" x="189" y="324" text-anchor="middle">体系结构的语言</text>
</g>
<path class="line" d="M 294 306 L 406 306"/>
<g>
  <rect class="shadow" x="412" y="254" width="210" height="116"/>
  <rect class="box" x="406" y="248" width="210" height="116"/>
  <text class="title" x="511" y="290" text-anchor="middle">SPEC与</text>
  <text class="note" x="511" y="324" text-anchor="middle">MLPerf的启发和</text>
  <text class="note" x="511" y="348" text-anchor="middle">局限</text>
</g>
<path class="line" d="M 616 306 L 728 306"/>
<g>
  <rect class="shadow" x="734" y="254" width="210" height="116"/>
  <rect class="box" x="728" y="248" width="210" height="116"/>
  <text class="title" x="833" y="290" text-anchor="middle">微基准</text>
  <text class="note" x="833" y="324" text-anchor="middle">隔离Agent</text>
  <text class="note" x="833" y="348" text-anchor="middle">CPU的机制</text>
</g>
<path class="line" d="M 938 306 L 1050 306"/>
<g>
  <rect class="shadow" x="1056" y="254" width="210" height="116"/>
  <rect class="box" x="1050" y="248" width="210" height="116"/>
  <text class="title" x="1155" y="290" text-anchor="middle">宏基准</text>
  <text class="note" x="1155" y="324" text-anchor="middle">端到端的长任务</text>
</g>
<g>
  <rect class="shadow" x="456" y="624" width="500" height="72"/>
  <rect class="light" x="450" y="618" width="500" height="72"/>
  <text class="label" x="700" y="661" text-anchor="middle">从 SPEC 到 Agentic Benchmark 的展开路径</text>
