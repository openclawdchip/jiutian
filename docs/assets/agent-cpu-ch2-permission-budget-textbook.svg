<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">权限边界与预算分配</title>
  <desc id="desc">展示权限决定能不能做，预算决定先做什么，二者共同构成执行边界。</desc>
  <defs>
    <marker id="arrow-pb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow-pb); }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 21px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="780"/>

  <g>
    <rect class="shadow" x="540" y="62" width="320" height="74"/>
    <rect class="light" x="534" y="56" width="320" height="74"/>
    <text class="label" x="694" y="100" text-anchor="middle">执行边界</text>
  </g>

  <g>
    <rect class="shadow" x="96" y="180" width="432" height="338"/>
    <rect class="box" x="90" y="174" width="432" height="338"/>
    <text class="title" x="306" y="220" text-anchor="middle">权限边界</text>

    <rect class="shadow" x="138" y="250" width="332" height="66"/>
    <rect class="light" x="132" y="244" width="332" height="66"/>
    <text class="label" x="296" y="284" text-anchor="middle">允许</text>
    <text class="note" x="296" y="306" text-anchor="middle">读取资料 / 调用地图</text>

    <rect class="shadow" x="138" y="338" width="332" height="66"/>
    <rect class="light" x="132" y="332" width="332" height="66"/>
    <text class="label" x="296" y="372" text-anchor="middle">需确认</text>
    <text class="note" x="296" y="394" text-anchor="middle">发送通知 / 修改日程</text>

    <rect class="shadow" x="138" y="426" width="332" height="66"/>
    <rect class="light" x="132" y="420" width="332" height="66"/>
    <text class="label" x="296" y="460" text-anchor="middle">禁止</text>
    <text class="note" x="296" y="482" text-anchor="middle">公开发布 / 不可逆提交</text>
  </g>

  <g>
    <rect class="shadow" x="874" y="180" width="432" height="338"/>
    <rect class="box" x="868" y="174" width="432" height="338"/>
    <text class="title" x="1084" y="220" text-anchor="middle">两小时预算</text>

    <rect class="shadow" x="926" y="266" width="116" height="78"/>
    <rect class="light" x="920" y="260" width="116" height="78"/>
    <text class="note" x="978" y="296" text-anchor="middle">明确题目</text>
    <text class="note" x="978" y="322" text-anchor="middle">20 分钟</text>

    <rect class="shadow" x="1048" y="266" width="178" height="78"/>
    <rect class="light" x="1042" y="260" width="178" height="78"/>
    <text class="note" x="1132" y="296" text-anchor="middle">查证材料</text>
    <text class="note" x="1132" y="322" text-anchor="middle">40 分钟</text>

    <rect class="shadow" x="926" y="356" width="148" height="78"/>
    <rect class="light" x="920" y="350" width="148" height="78"/>
    <text class="note" x="992" y="386" text-anchor="middle">形成提纲</text>
    <text class="note" x="992" y="412" text-anchor="middle">30 分钟</text>

    <rect class="shadow" x="1080" y="356" width="116" height="78"/>
    <rect class="light" x="1074" y="350" width="116" height="78"/>
    <text class="note" x="1126" y="386" text-anchor="middle">写讲稿</text>
    <text class="note" x="1126" y="412" text-anchor="middle">20 分钟</text>

    <rect class="shadow" x="1202" y="356" width="54" height="78"/>
    <rect class="light" x="1196" y="350" width="54" height="78"/>
    <text class="note" x="1223" y="386" text-anchor="middle">检查</text>
    <text class="note" x="1223" y="412" text-anchor="middle">10</text>
  </g>

  <path class="line" d="M 534 92 L 406 174"/>
  <path class="line" d="M 854 92 L 982 174"/>

  <g>
    <rect class="shadow" x="390" y="602" width="620" height="74"/>
    <rect class="light" x="384" y="596" width="620" height="74"/>
    <text class="label" x="694" y="640" text-anchor="middle">权限决定能不能做，预算决定先做什么</text>
  </g>
</svg>
