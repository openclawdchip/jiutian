<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">第一章引出的五类基础体系结构问题</title>
  <desc id="desc">以灰阶教材框图展示控制流表示、状态管理、调度与资源分配、推测与回滚、可验证性五类问题与 Agent CPU 的关系。</desc>
  <defs>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow-q); }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 22px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="780"/>

  <g>
    <rect class="shadow" x="546" y="300" width="308" height="94"/>
    <rect class="box" x="540" y="294" width="308" height="94"/>
    <text class="title" x="694" y="340" text-anchor="middle">Agent CPU</text>
    <text class="note" x="694" y="372" text-anchor="middle">体系结构问题空间</text>
  </g>

  <g>
    <rect class="shadow" x="188" y="104" width="286" height="102"/>
    <rect class="box" x="182" y="98" width="286" height="102"/>
    <text class="label" x="325" y="144" text-anchor="middle">控制流表示</text>
    <text class="note" x="325" y="176" text-anchor="middle">检索、调用、验证如何成为</text>
    <text class="note" x="325" y="200" text-anchor="middle">可调度执行单元</text>

    <rect class="shadow" x="926" y="104" width="286" height="102"/>
    <rect class="box" x="920" y="98" width="286" height="102"/>
    <text class="label" x="1063" y="144" text-anchor="middle">状态管理</text>
    <text class="note" x="1063" y="176" text-anchor="middle">上下文、记忆、工具结果如何</text>
    <text class="note" x="1063" y="200" text-anchor="middle">分层组织与清理</text>

    <rect class="shadow" x="188" y="520" width="286" height="102"/>
    <rect class="box" x="182" y="514" width="286" height="102"/>
    <text class="label" x="325" y="560" text-anchor="middle">推测与回滚</text>
    <text class="note" x="325" y="592" text-anchor="middle">错误路径与外部副作用如何</text>
    <text class="note" x="325" y="616" text-anchor="middle">恢复与撤回</text>

    <rect class="shadow" x="557" y="612" width="286" height="102"/>
    <rect class="box" x="551" y="606" width="286" height="102"/>
    <text class="label" x="694" y="652" text-anchor="middle">可验证性</text>
    <text class="note" x="694" y="684" text-anchor="middle">来源、权限、轨迹、结果校验</text>

    <rect class="shadow" x="926" y="520" width="304" height="102"/>
    <rect class="box" x="920" y="514" width="304" height="102"/>
    <text class="label" x="1072" y="560" text-anchor="middle">调度与资源分配</text>
    <text class="note" x="1072" y="592" text-anchor="middle">CPU、GPU、NPU、网络、存储</text>
    <text class="note" x="1072" y="616" text-anchor="middle">如何协同并权衡成本</text>
  </g>

  <path class="line" d="M 468 192 C 530 230 580 262 610 294"/>
  <path class="line" d="M 920 192 C 860 228 814 260 782 294"/>
  <path class="line" d="M 468 514 C 530 478 576 434 616 388"/>
  <path class="line" d="M 920 514 C 860 478 814 434 770 388"/>
  <path class="line" d="M 694 606 L 694 388"/>
</svg>
