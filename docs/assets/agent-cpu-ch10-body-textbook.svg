<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Ledger-Aware Memory 的语义层次</title>
  <desc id="desc">Ledger-Aware Memory 的语义层次</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #666; stroke-width: 1.4; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .rule { fill: none; stroke: #666; stroke-width: 1.4; }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 21px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
      .small { font: 400 16px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="780"/>
  <g>
    <rect class="shadow" x="596" y="78" width="220" height="72"/>
    <rect class="light" x="590" y="72" width="220" height="72"/>
    <text class="label" x="700" y="115" text-anchor="middle">近 / 小 / 快</text>
  </g>
<g>
    <rect class="shadow" x="478" y="180" width="456" height="78"/>
    <rect class="box" x="472" y="174" width="456" height="78"/>
    <text class="title" x="700" y="216" text-anchor="middle">上下文工作集</text>
    <text class="note" x="700" y="252" text-anchor="middle">当前轮次最热对象</text>
  </g>
<g>
    <rect class="shadow" x="500" y="288" width="412" height="78"/>
    <rect class="box" x="494" y="282" width="412" height="78"/>
    <text class="title" x="700" y="324" text-anchor="middle">SPM / Cluster SRAM</text>
    <text class="note" x="700" y="360" text-anchor="middle">显式编排的数据块</text>
  </g>
<g>
    <rect class="shadow" x="522" y="396" width="368" height="78"/>
    <rect class="box" x="516" y="390" width="368" height="78"/>
    <text class="title" x="700" y="432" text-anchor="middle">Ledger Cache</text>
    <text class="note" x="700" y="468" text-anchor="middle">可恢复、可提交的任务状态</text>
  </g>
<g>
    <rect class="shadow" x="550" y="504" width="312" height="78"/>
    <rect class="box" x="544" y="498" width="312" height="78"/>
    <text class="title" x="700" y="540" text-anchor="middle">HBM / DRAM</text>
    <text class="note" x="700" y="576" text-anchor="middle">大容量中间层</text>
  </g>
<g>
    <rect class="shadow" x="572" y="612" width="268" height="78"/>
    <rect class="box" x="566" y="606" width="268" height="78"/>
    <text class="title" x="700" y="648" text-anchor="middle">Artifact / Trace / 外存</text>
    <text class="note" x="700" y="684" text-anchor="middle">长期、可审计对象</text>
  </g>
<path class="line" d="M 700 144 L 700 174"/>
<path class="line" d="M 700 252 L 700 282"/>
<path class="line" d="M 700 360 L 700 390"/>
<path class="line" d="M 700 468 L 700 498"/>
<path class="line" d="M 700 576 L 700 606"/>
<g>
    <rect class="shadow" x="1014" y="218" width="220" height="72"/>
    <rect class="light" x="1008" y="212" width="220" height="72"/>
    <text class="label" x="1118" y="255" text-anchor="middle">goal / context</text>
  </g>
<g>
    <rect class="shadow" x="1014" y="426" width="220" height="72"/>
    <rect class="light" x="1008" y="420" width="220" height="72"/>
    <text class="label" x="1118" y="463" text-anchor="middle">ledger delta</text>
  </g>
<g>
    <rect class="shadow" x="1014" y="594" width="220" height="72"/>
    <rect class="light" x="1008" y="588" width="220" height="72"/>
    <text class="label" x="1118" y="631" text-anchor="middle">artifact preview</text>
  </g>
<path class="line" d="M 928 214 L 1008 248"/>
<path class="line" d="M 884 430 L 1008 456"/>
<path class="line" d="M 834 642 L 1008 624"/>
