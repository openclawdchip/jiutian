  </g>
<g>
    <rect class="shadow" x="506" y="242" width="188" height="76"/>
    <rect class="light" x="500" y="236" width="188" height="76"/>
    <text class="label" x="594" y="281" text-anchor="middle">配置约束</text>
  </g>
<g>
    <rect class="shadow" x="720" y="242" width="188" height="76"/>
    <rect class="light" x="714" y="236" width="188" height="76"/>
    <text class="label" x="808" y="281" text-anchor="middle">运行实验</text>
  </g>
<g>
    <rect class="shadow" x="934" y="242" width="188" height="76"/>
    <rect class="light" x="928" y="236" width="188" height="76"/>
    <text class="label" x="1022" y="281" text-anchor="middle">记录 trace</text>
