<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">七个基本抽象把回答推进为执行</title>
  <desc id="desc">从用户目标出发，经过任务、证据、投影、权限、预算、trace 和候选提交，形成可审查结果的执行链。</desc>
  <defs>
    <marker id="arrow-exec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow-exec); }
      .rule { fill: none; stroke: #666; stroke-width: 1.4; }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 21px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="780"/>

  <g>
    <rect class="shadow" x="552" y="72" width="296" height="72"/>
    <rect class="light" x="546" y="66" width="296" height="72"/>
    <text class="label" x="694" y="108" text-anchor="middle">用户目标</text>
  </g>

  <path class="line" d="M 694 138 L 694 232"/>

  <g>
    <rect class="shadow" x="72" y="232" width="150" height="110"/>
    <rect class="box" x="66" y="226" width="150" height="110"/>
    <text class="title" x="141" y="276" text-anchor="middle">任务</text>
    <text class="note" x="141" y="308" text-anchor="middle">目标 / 成功条件</text>

    <rect class="shadow" x="248" y="232" width="150" height="110"/>
    <rect class="box" x="242" y="226" width="150" height="110"/>
    <text class="title" x="317" y="276" text-anchor="middle">证据</text>
    <text class="note" x="317" y="308" text-anchor="middle">可检查依据</text>

    <rect class="shadow" x="424" y="232" width="150" height="110"/>
    <rect class="box" x="418" y="226" width="150" height="110"/>
    <text class="title" x="493" y="276" text-anchor="middle">投影</text>
    <text class="note" x="493" y="308" text-anchor="middle">任务视图</text>

    <rect class="shadow" x="600" y="232" width="150" height="110"/>
    <rect class="box" x="594" y="226" width="150" height="110"/>
    <text class="title" x="669" y="276" text-anchor="middle">权限</text>
    <text class="note" x="669" y="308" text-anchor="middle">行动边界</text>

    <rect class="shadow" x="776" y="232" width="150" height="110"/>
    <rect class="box" x="770" y="226" width="150" height="110"/>
    <text class="title" x="845" y="276" text-anchor="middle">预算</text>
    <text class="note" x="845" y="308" text-anchor="middle">资源分配</text>

    <rect class="shadow" x="952" y="232" width="150" height="110"/>
    <rect class="box" x="946" y="226" width="150" height="110"/>
    <text class="title" x="1021" y="276" text-anchor="middle">trace</text>
    <text class="note" x="1021" y="308" text-anchor="middle">关键过程记录</text>

    <rect class="shadow" x="1128" y="232" width="188" height="110"/>
    <rect class="box" x="1122" y="226" width="188" height="110"/>
    <text class="title" x="1216" y="276" text-anchor="middle">候选提交</text>
    <text class="note" x="1216" y="308" text-anchor="middle">可审查结果</text>
  </g>

  <path class="line" d="M 216 281 L 242 281"/>
  <path class="line" d="M 392 281 L 418 281"/>
  <path class="line" d="M 568 281 L 594 281"/>
  <path class="line" d="M 744 281 L 770 281"/>
  <path class="line" d="M 920 281 L 946 281"/>
  <path class="line" d="M 1096 281 L 1122 281"/>

  <text class="note" x="317" y="446" text-anchor="middle">界定问题</text>
  <line class="rule" x1="108" y1="456" x2="526" y2="456"/>

  <text class="note" x="756" y="446" text-anchor="middle">约束执行</text>
  <line class="rule" x1="626" y1="456" x2="894" y2="456"/>

  <text class="note" x="1128" y="446" text-anchor="middle">复盘与交付</text>
  <line class="rule" x1="972" y1="456" x2="1284" y2="456"/>

  <g>
    <rect class="shadow" x="484" y="558" width="428" height="76"/>
    <rect class="light" x="478" y="552" width="428" height="76"/>
    <text class="label" x="692" y="598" text-anchor="middle">七个抽象把“回答”推进为“执行”</text>
  </g>
</svg>
