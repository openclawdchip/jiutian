<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">科研助手任务的多轮执行闭环</title>
  <desc id="desc">三轮执行中的模型推理、工具调用和记忆状态。</desc>
  <defs>
    <marker id="arrow-ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .head { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow-ra); }
      .dash { fill: none; stroke: #666; stroke-width: 1.4; stroke-dasharray: 7 6; marker-end: url(#arrow-ra); }
      .row { font: 400 22px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 20px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820"/>

  <g>
    <rect class="shadow" x="208" y="58" width="984" height="68"/>
    <rect class="box" x="200" y="50" width="984" height="68"/>
    <text class="label" x="692" y="92" text-anchor="middle">目标：比较三种模型在小样本数据集上的表现，并形成一页报告</text>
  </g>

  <text class="row" x="88" y="248">模型推理</text>
  <text class="row" x="88" y="468">工具调用</text>
  <text class="row" x="68" y="688">记忆 / 上下文</text>

  <g>
    <rect class="shadow" x="288" y="152" width="244" height="52"/>
    <rect class="head" x="282" y="146" width="244" height="52"/>
    <text class="title" x="404" y="180" text-anchor="middle">第 1 轮</text>

    <rect class="shadow" x="620" y="152" width="244" height="52"/>
    <rect class="head" x="614" y="146" width="244" height="52"/>
    <text class="title" x="736" y="180" text-anchor="middle">第 2 轮</text>

    <rect class="shadow" x="952" y="152" width="244" height="52"/>
    <rect class="head" x="946" y="146" width="244" height="52"/>
    <text class="title" x="1068" y="180" text-anchor="middle">第 3 轮</text>
  </g>

  <g>
    <rect class="shadow" x="288" y="242" width="244" height="112"/>
    <rect class="box" x="282" y="236" width="244" height="112"/>
    <text class="title" x="404" y="284" text-anchor="middle">理解任务边界</text>
    <text class="note" x="404" y="321" text-anchor="middle">模型、数据集、指标</text>

    <rect class="shadow" x="620" y="242" width="244" height="112"/>
    <rect class="box" x="614" y="236" width="244" height="112"/>
    <text class="title" x="736" y="284" text-anchor="middle">判断缺失影响比较</text>
    <text class="note" x="736" y="321" text-anchor="middle">决定补算 F1</text>

    <rect class="shadow" x="952" y="242" width="244" height="112"/>
    <rect class="box" x="946" y="236" width="244" height="112"/>
    <text class="title" x="1068" y="284" text-anchor="middle">比较精度、稳定性、成本</text>
    <text class="note" x="1068" y="321" text-anchor="middle">形成结论候选</text>
  </g>

  <g>
    <rect class="shadow" x="288" y="462" width="244" height="112"/>
    <rect class="box" x="282" y="456" width="244" height="112"/>
    <text class="title" x="404" y="504" text-anchor="middle">读取实验记录</text>
    <text class="note" x="404" y="541" text-anchor="middle">表格、日志、混淆矩阵</text>

    <rect class="shadow" x="620" y="462" width="244" height="112"/>
    <rect class="box" x="614" y="456" width="244" height="112"/>
    <text class="title" x="736" y="504" text-anchor="middle">调用计算工具</text>
    <text class="note" x="736" y="541" text-anchor="middle">重新计算 F1</text>

    <rect class="shadow" x="952" y="462" width="244" height="112"/>
    <rect class="box" x="946" y="456" width="244" height="112"/>
    <text class="title" x="1068" y="504" text-anchor="middle">核对一致性与篇幅</text>
    <text class="note" x="1068" y="541" text-anchor="middle">完成自检</text>
  </g>

  <g>
    <rect class="shadow" x="288" y="682" width="244" height="112"/>
    <rect class="box" x="282" y="676" width="244" height="112"/>
    <text class="title" x="404" y="724" text-anchor="middle">记录中间结果</text>
    <text class="note" x="404" y="761" text-anchor="middle">发现“缺少 F1”</text>

    <rect class="shadow" x="620" y="682" width="244" height="112"/>
    <rect class="box" x="614" y="676" width="244" height="112"/>
    <text class="title" x="736" y="724" text-anchor="middle">写回新指标</text>
    <text class="note" x="736" y="761" text-anchor="middle">状态变为“可比较”</text>

    <rect class="shadow" x="952" y="682" width="244" height="112"/>
    <rect class="box" x="946" y="676" width="244" height="112"/>
    <text class="title" x="1068" y="724" text-anchor="middle">输出报告草稿</text>
    <text class="note" x="1068" y="761" text-anchor="middle">一页可交付结果</text>
  </g>

  <path class="line" d="M 526 292 L 614 292"/>
  <path class="line" d="M 858 292 L 946 292"/>
  <path class="line" d="M 526 512 L 614 512"/>
  <path class="line" d="M 858 512 L 946 512"/>
  <path class="line" d="M 526 732 L 614 732"/>
  <path class="line" d="M 858 732 L 946 732"/>

  <path class="line" d="M 404 348 L 404 456"/>
  <path class="line" d="M 736 348 L 736 456"/>
  <path class="line" d="M 1068 348 L 1068 456"/>
  <path class="line" d="M 404 568 L 404 676"/>
  <path class="line" d="M 736 568 L 736 676"/>
  <path class="line" d="M 1068 568 L 1068 676"/>

  <path class="dash" d="M 946 786 C 835 835 640 836 526 786"/>
</svg>
