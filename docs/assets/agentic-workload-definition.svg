<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic workload 定义框架</title>
  <desc id="desc">以教材式框图展示任务目标、上下文、行动和反馈之间的循环关系，以及底部四项体系结构特征。</desc>
  <defs>
    <marker id="arrow-def" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #999; }
      .box { fill: #e9e9e9; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f6f6f6; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 2; marker-end: url(#arrow-def); }
      .dash { fill: none; stroke: #555; stroke-width: 1.6; stroke-dasharray: 8 6; }
      .title { font: 700 34px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 700 28px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .body { font: 400 21px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
      .small { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <g>
    <rect class="shadow" x="657" y="303" width="286" height="96"/>
    <rect class="box" x="648" y="294" width="286" height="96"/>
    <text class="title" x="791" y="352" text-anchor="middle">Agentic workload</text>
  </g>

  <g>
    <rect class="shadow" x="651" y="118" width="250" height="72"/>
    <rect class="box" x="644" y="111" width="250" height="72"/>
    <text class="label" x="769" y="156" text-anchor="middle">任务目标</text>

    <rect class="shadow" x="1098" y="319" width="228" height="72"/>
    <rect class="box" x="1091" y="312" width="228" height="72"/>
    <text class="label" x="1205" y="357" text-anchor="middle">行动选择</text>

    <rect class="shadow" x="657" y="532" width="250" height="72"/>
    <rect class="box" x="650" y="525" width="250" height="72"/>
    <text class="label" x="775" y="570" text-anchor="middle">反馈更新</text>

    <rect class="shadow" x="256" y="319" width="228" height="72"/>
    <rect class="box" x="249" y="312" width="228" height="72"/>
    <text class="label" x="363" y="357" text-anchor="middle">上下文状态</text>
  </g>

  <path class="line" d="M 769 183 C 925 190 1030 240 1110 312"/>
  <path class="line" d="M 1205 384 C 1180 468 1035 529 900 555"/>
  <path class="line" d="M 650 555 C 520 529 380 470 363 384"/>
  <path class="line" d="M 249 348 C 330 240 470 177 644 147"/>
  <path class="dash" d="M 594 345 C 625 345 640 345 648 345"/>
  <path class="dash" d="M 934 345 C 1000 345 1045 345 1091 345"/>

  <text class="body" x="655" y="678">体系结构视角下的关键特征</text>
  <line x1="650" y1="688" x2="1040" y2="688" stroke="#444" stroke-width="1.6"/>

  <g>
    <rect class="shadow" x="188" y="738" width="270" height="62"/>
    <rect class="light" x="182" y="732" width="270" height="62"/>
    <text class="body" x="317" y="772" text-anchor="middle">动态控制流</text>

    <rect class="shadow" x="496" y="738" width="270" height="62"/>
    <rect class="light" x="490" y="732" width="270" height="62"/>
    <text class="body" x="625" y="772" text-anchor="middle">分层状态</text>

    <rect class="shadow" x="804" y="738" width="270" height="62"/>
    <rect class="light" x="798" y="732" width="270" height="62"/>
    <text class="body" x="933" y="772" text-anchor="middle">复合性能</text>

    <rect class="shadow" x="1112" y="738" width="270" height="62"/>
    <rect class="light" x="1106" y="732" width="270" height="62"/>
    <text class="body" x="1241" y="772" text-anchor="middle">过程约束</text>
  </g>
</svg>
