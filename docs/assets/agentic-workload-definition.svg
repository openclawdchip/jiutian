<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Agentic workload 的四个基本要素与体系结构特征</title>
  <desc id="desc">以灰阶教材框图展示任务目标、上下文状态、行动选择、反馈更新的循环关系，以及四个体系结构特征。</desc>
  <defs>
    <marker id="arrow-def" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow-def); }
      .dash { fill: none; stroke: #666; stroke-width: 1.4; stroke-dasharray: 7 6; }
      .rule { fill: none; stroke: #666; stroke-width: 1.4; }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 22px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 19px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="780"/>

  <g>
    <rect class="shadow" x="586" y="276" width="240" height="82"/>
    <rect class="box" x="580" y="270" width="240" height="82"/>
    <text class="title" x="700" y="320" text-anchor="middle">Agentic workload</text>
  </g>

  <g>
    <rect class="shadow" x="596" y="96" width="212" height="70"/>
    <rect class="box" x="590" y="90" width="212" height="70"/>
    <text class="label" x="696" y="134" text-anchor="middle">任务目标</text>

    <rect class="shadow" x="936" y="276" width="212" height="70"/>
    <rect class="box" x="930" y="270" width="212" height="70"/>
    <text class="label" x="1036" y="314" text-anchor="middle">行动选择</text>

    <rect class="shadow" x="596" y="456" width="212" height="70"/>
    <rect class="box" x="590" y="450" width="212" height="70"/>
    <text class="label" x="696" y="494" text-anchor="middle">反馈更新</text>

    <rect class="shadow" x="256" y="276" width="212" height="70"/>
    <rect class="box" x="250" y="270" width="212" height="70"/>
    <text class="label" x="356" y="314" text-anchor="middle">上下文状态</text>
  </g>

  <path class="line" d="M 702 160 C 850 168 968 212 1034 270"/>
  <path class="line" d="M 1036 340 C 1012 410 910 472 800 488"/>
  <path class="line" d="M 590 488 C 476 471 376 410 352 340"/>
  <path class="line" d="M 356 270 C 422 210 540 166 590 150"/>
  <path class="dash" d="M 462 305 L 580 305"/>
  <path class="dash" d="M 820 305 L 930 305"/>

  <text class="note" x="700" y="610" text-anchor="middle">体系结构特征</text>
  <line class="rule" x1="548" y1="620" x2="852" y2="620"/>

  <g>
    <rect class="shadow" x="168" y="654" width="220" height="62"/>
    <rect class="light" x="162" y="648" width="220" height="62"/>
    <text class="note" x="272" y="687" text-anchor="middle">动态控制流</text>

    <rect class="shadow" x="428" y="654" width="220" height="62"/>
    <rect class="light" x="422" y="648" width="220" height="62"/>
    <text class="note" x="532" y="687" text-anchor="middle">分层状态</text>

    <rect class="shadow" x="688" y="654" width="220" height="62"/>
    <rect class="light" x="682" y="648" width="220" height="62"/>
    <text class="note" x="792" y="687" text-anchor="middle">复合性能</text>

    <rect class="shadow" x="948" y="654" width="220" height="62"/>
    <rect class="light" x="942" y="648" width="220" height="62"/>
    <text class="note" x="1052" y="687" text-anchor="middle">过程约束</text>
  </g>
</svg>
