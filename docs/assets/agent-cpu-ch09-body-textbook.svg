<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">从 ISA 契约到 APU-IR 契约</title>
  <desc id="desc">从 ISA 契约到 APU-IR 契约</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #666; stroke-width: 1.4; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .rule { fill: none; stroke: #666; stroke-width: 1.4; }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 21px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
      .small { font: 400 16px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="780"/>
  <g>
    <rect class="shadow" x="134" y="162" width="332" height="184"/>
    <rect class="box" x="128" y="156" width="332" height="184"/>
    <text class="title" x="294" y="198" text-anchor="middle">ISA</text>
    <text class="note" x="294" y="234" text-anchor="middle">寄存器 / 指令 / 异常</text>
    <text class="note" x="294" y="260" text-anchor="middle">内存模型 / 特权级</text>
  </g>
<g>
    <rect class="shadow" x="540" y="256" width="332" height="84"/>
    <rect class="light" x="534" y="250" width="332" height="84"/>
    <text class="label" x="700" y="299" text-anchor="middle">扩展抽象层级</text>
  </g>
<g>
    <rect class="shadow" x="946" y="162" width="332" height="184"/>
    <rect class="box" x="940" y="156" width="332" height="184"/>
    <text class="title" x="1106" y="198" text-anchor="middle">APU-IR</text>
    <text class="note" x="1106" y="234" text-anchor="middle">任务图 / 权限 / 预算 / trace</text>
    <text class="note" x="1106" y="260" text-anchor="middle">把任务语义变成稳定契约</text>
  </g>
<g>
    <rect class="shadow" x="216" y="476" width="220" height="72"/>
    <rect class="light" x="210" y="470" width="220" height="72"/>
    <text class="label" x="320" y="513" text-anchor="middle">稳定边界</text>
  </g>
<g>
    <rect class="shadow" x="600" y="476" width="220" height="72"/>
    <rect class="light" x="594" y="470" width="220" height="72"/>
    <text class="label" x="704" y="513" text-anchor="middle">可扩展机制</text>
  </g>
<g>
    <rect class="shadow" x="984" y="476" width="220" height="72"/>
    <rect class="light" x="978" y="470" width="220" height="72"/>
    <text class="label" x="1088" y="513" text-anchor="middle">实现自由度</text>
  </g>
<path class="line" d="M 460 248 L 534 292"/>
<path class="line" d="M 866 292 L 940 248"/>
<path class="line" d="M 294 340 L 320 470"/>
<path class="line" d="M 700 334 L 704 470"/>
<path class="line" d="M 1106 340 L 1088 470"/>
<g>
    <rect class="shadow" x="326" y="618" width="760" height="72"/>
    <rect class="light" x="320" y="612" width="760" height="72"/>
    <text class="label" x="700" y="655" text-anchor="middle">从指令契约上升到任务契约，但仍保留体系结构边界的稳定性</text>
  </g>
</svg>