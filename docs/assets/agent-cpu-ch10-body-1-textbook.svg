<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">从 Cache 到 Ledger-Aware Memory 的层次展开</title>
  <desc id="desc">从 Cache 到 Ledger-Aware Memory 的层次展开</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #666; stroke-width: 1.4; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .rule { fill: none; stroke: #666; stroke-width: 1.4; }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 21px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
      .small { font: 400 16px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="780"/>
  <g>
  <rect class="shadow" x="506" y="52" width="400" height="74"/>
  <rect class="light" x="500" y="46" width="400" height="74"/>
  <text class="label" x="700" y="88" text-anchor="middle">从Cache到Ledger-Aware</text>
  <text class="small" x="700" y="122" text-anchor="middle">Memory</text>
</g>
<g>
  <rect class="shadow" x="480" y="144" width="452" height="90"/>
  <rect class="box" x="474" y="138" width="452" height="90"/>
  <text class="title" x="700" y="190" text-anchor="middle">从传统Cache出发</text>
</g>
<path class="line" d="M 700 228 L 700 258"/>
<g>
  <rect class="shadow" x="480" y="264" width="452" height="90"/>
  <rect class="box" x="474" y="258" width="452" height="90"/>
  <text class="title" x="700" y="310" text-anchor="middle">从容量层次到语义层次</text>
</g>
<path class="line" d="M 700 348 L 700 378"/>
<g>
  <rect class="shadow" x="480" y="384" width="452" height="90"/>
  <rect class="box" x="474" y="378" width="452" height="90"/>
  <text class="title" x="700" y="420" text-anchor="middle">SPM、Cluster</text>
  <text class="note" x="700" y="454" text-anchor="middle">SRAM与显式DMA</text>
</g>
<path class="line" d="M 700 468 L 700 498"/>
<g>
  <rect class="shadow" x="480" y="504" width="452" height="90"/>
  <rect class="box" x="474" y="498" width="452" height="90"/>
  <text class="title" x="700" y="540" text-anchor="middle">Ledger-Aware</text>
  <text class="note" x="700" y="574" text-anchor="middle">Memory的基本概念</text>
</g>
<g>
  <rect class="shadow" x="456" y="624" width="500" height="72"/>
  <rect class="light" x="450" y="618" width="500" height="72"/>
  <text class="label" x="700" y="661" text-anchor="middle">从 Cache 到 Ledger-Aware Memory 的层次展开</text>
</g>
</svg>