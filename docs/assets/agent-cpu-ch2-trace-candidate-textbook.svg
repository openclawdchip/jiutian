<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">trace 与候选提交的复盘闭环</title>
  <desc id="desc">执行步骤写入 trace，trace 支撑审查，候选提交可被接受或修改，并在修改后回到生成阶段。</desc>
  <defs>
    <marker id="arrow-tc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .bg { fill: #fff; }
      .shadow { fill: #9a9a9a; }
      .box { fill: #efefef; stroke: #4a4a4a; stroke-width: 2; }
      .light { fill: #f9f9f9; stroke: #4a4a4a; stroke-width: 1.8; }
      .line { fill: none; stroke: #444; stroke-width: 1.8; marker-end: url(#arrow-tc); }
      .dash { fill: none; stroke: #666; stroke-width: 1.4; stroke-dasharray: 7 6; marker-end: url(#arrow-tc); }
      .title { font: 400 24px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .label { font: 400 21px "SimSun","Songti SC","Noto Serif SC",serif; fill: #222; }
      .note { font: 400 18px "SimSun","Songti SC","Noto Serif SC",serif; fill: #333; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="780"/>

  <g>
    <rect class="shadow" x="114" y="96" width="234" height="72"/>
    <rect class="light" x="108" y="90" width="234" height="72"/>
    <text class="label" x="224" y="132" text-anchor="middle">任务理解</text>

    <rect class="shadow" x="114" y="208" width="234" height="72"/>
    <rect class="light" x="108" y="202" width="234" height="72"/>
    <text class="label" x="224" y="244" text-anchor="middle">选择证据</text>

    <rect class="shadow" x="114" y="320" width="234" height="72"/>
    <rect class="light" x="108" y="314" width="234" height="72"/>
    <text class="label" x="224" y="356" text-anchor="middle">形成投影</text>

    <rect class="shadow" x="114" y="432" width="234" height="72"/>
    <rect class="light" x="108" y="426" width="234" height="72"/>
    <text class="label" x="224" y="468" text-anchor="middle">生成候选</text>
  </g>

  <path class="line" d="M 224 162 L 224 202"/>
  <path class="line" d="M 224 274 L 224 314"/>
  <path class="line" d="M 224 386 L 224 426"/>

  <g>
    <rect class="shadow" x="524" y="236" width="316" height="202"/>
    <rect class="box" x="518" y="230" width="316" height="202"/>
    <text class="title" x="676" y="278" text-anchor="middle">trace</text>
    <text class="note" x="676" y="314" text-anchor="middle">关键选择</text>
    <text class="note" x="676" y="342" text-anchor="middle">使用证据</text>
    <text class="note" x="676" y="370" text-anchor="middle">权限 / 预算约束</text>
    <text class="note" x="676" y="398" text-anchor="middle">未决问题</text>
  </g>

  <path class="line" d="M 348 238 L 518 286"/>
  <path class="line" d="M 348 462 L 518 386"/>

  <g>
    <rect class="shadow" x="972" y="174" width="250" height="110"/>
    <rect class="box" x="966" y="168" width="250" height="110"/>
    <text class="title" x="1090" y="214" text-anchor="middle">候选提交</text>
    <text class="note" x="1090" y="246" text-anchor="middle">结论 / 依据 / 适用范围</text>

    <rect class="shadow" x="972" y="346" width="132" height="72"/>
    <rect class="light" x="966" y="340" width="132" height="72"/>
    <text class="label" x="1032" y="382" text-anchor="middle">审查</text>

    <rect class="shadow" x="1120" y="346" width="132" height="72"/>
    <rect class="light" x="1114" y="340" width="132" height="72"/>
    <text class="label" x="1180" y="382" text-anchor="middle">接受</text>

    <rect class="shadow" x="1046" y="456" width="132" height="72"/>
    <rect class="light" x="1040" y="450" width="132" height="72"/>
    <text class="label" x="1106" y="492" text-anchor="middle">修改</text>
  </g>

  <path class="line" d="M 834 294 L 966 228"/>
  <path class="line" d="M 834 376 L 966 376"/>
  <path class="line" d="M 1090 278 L 1032 340"/>
  <path class="line" d="M 1032 412 L 1106 450"/>
  <path class="line" d="M 1032 376 L 1114 376"/>
  <path class="dash" d="M 1040 486 C 796 610 420 610 224 504"/>

  <g>
    <rect class="shadow" x="418" y="610" width="556" height="74"/>
    <rect class="light" x="412" y="604" width="556" height="74"/>
    <text class="label" x="688" y="648" text-anchor="middle">trace 支撑复盘，候选提交支撑审查</text>
  </g>
</svg>
