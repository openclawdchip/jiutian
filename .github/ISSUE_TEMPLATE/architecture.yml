name: Architecture proposal
description: Propose or refine a JiuTian APU architecture decision.
title: "[arch] "
labels: ["architecture"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What architecture problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the proposed design.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: What alternatives or costs should reviewers consider?
    validations:
      required: true
